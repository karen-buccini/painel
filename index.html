<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Comercial</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap');

:root{
  /* Paleta do vixtra.com (navy + ciano, verde de apoio). Os nomes gold, mint,
     sky e coral são históricos: o data.json guarda cores como var(--gold),
     então os nomes ficam e só os valores seguem a marca. */
  --ink:#090F20;          /* vx-navy-900 */
  --ink-2:#0E162E;        /* vx-navy-800 */
  --panel:#121D3D;        /* vx-navy-700 */
  --panel-line: rgba(255,255,255,0.12);
  --gold:#5FC0E9;         /* vx-cyan-400: destaque principal */
  --sky:#27AAE1;          /* vx-cyan-500 */
  --mint:#28B665;         /* vx-apoio-verde */
  --coral:#F0616D;        /* negativo / negócio quente */
  --amber:#F5B544;        /* atenção / negócio morno */
  --overline:#8FDCFA;     /* sobrelinha do site */
  --paper:#FFFFFF;
  --muted:#929AB1;        /* vx-dark-ink-3 */
  --font:'Rubik',Verdana,system-ui,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font);
  overflow:hidden;
}

/* O painel é desenhado sempre em 1280x720 e escalado inteiro para caber na
   tela (encaixarNaTela, no script). Antes ele se adaptava pela largura da
   tela, e em TV que se apresenta ao navegador como 960x540 as fontes mínimas
   não cabiam. A base é 1280x720, e não 1920x1080, porque na TV do escritório
   (Mi Box + BrowseHere, 960x540) a base maior deixava tudo pequeno demais
   para ler de longe. */
.tv{
  position:absolute;
  left:0;top:0;
  width:1280px;
  height:720px;
  transform-origin:0 0;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(140deg, #16244C 0%, var(--ink) 62%);
}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: clamp(14px,14.4px,22px) clamp(20px,38.4px,48px);
  border-bottom:1px solid var(--panel-line);
  flex-shrink:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,19.1px,19px);
  letter-spacing:0.14em;
  color:var(--muted);
  text-transform:uppercase;
}
.brand .logo{height:clamp(18px,15.8px,26px);width:auto;display:block;}
.brand .sep{width:1px;height:clamp(16px,14.4px,22px);background:var(--panel-line);margin:0 6px;}
.brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--mint);
  box-shadow:0 0 10px var(--mint);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.clockbox{
  font-family:var(--font);font-variant-numeric:tabular-nums;
  text-align:right;
  color:var(--paper);
}
.clockbox .linha{display:flex;align-items:baseline;justify-content:flex-end;gap:clamp(10px,12.8px,16px);}
.clockbox .time{font-size:clamp(20px,30.7px,30px);font-weight:500;letter-spacing:0.02em;}
.clockbox .clima{font-size:clamp(14px,17.3px,18px);color:var(--muted);white-space:nowrap;}
.clockbox .clima:empty{display:none;}
.clockbox .date{font-size:clamp(14px,17.3px,18px);color:var(--muted);text-transform:capitalize;}

/* ===== STAGE ===== */
.stage{
  flex:1;
  position:relative;
  overflow:hidden;
}
.slide{
  position:absolute;
  inset:0;
  padding:clamp(28px,28.8px,56px) clamp(28px,64px,72px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .55s ease, transform .55s ease;
  pointer-events:none;
}
.slide.active{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.eyebrow{
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,18.2px,19px);
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--overline);
  margin-bottom:clamp(10px,11.5px,18px);
  display:flex;
  align-items:center;
  gap:10px;
}

/* ===== SLIDE: META ===== */
.goal-num{
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  
  font-size:clamp(45px,92.2px,120px);
  line-height:0.95;
  color:var(--paper);
}
.goal-num .accent{color:var(--mint);}
.goal-sub{
  font-size:clamp(15px,19.2px,20px);
  color:var(--muted);
  margin-top:8px;
  max-width:700px;
}
.progress-wrap{
  margin-top:clamp(24px,28.8px,40px);
  max-width:900px;
}
.progress-track{
  height:22px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--panel-line);
  overflow:hidden;
}
.progress-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--sky),var(--gold));
  box-shadow:0 0 18px rgba(40,182,101,0.5);
  width:0%;
  transition:width 1.2s cubic-bezier(.2,.8,.2,1);
}
.progress-labels{
  display:flex;justify-content:space-between;
  margin-top:10px;
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,17.3px,18px);
  color:var(--muted);
}
.tiles-row{
  display:flex;gap:clamp(14px,25.6px,28px);
  margin-top:clamp(24px,28.8px,40px);
  flex-wrap:wrap;
}
.tile{
  background:var(--panel);
  border:1px solid var(--panel-line);
  border-radius:16px;
  padding:clamp(16px,23px,22px) clamp(20px,28.2px,28px);
  min-width:180px;
}
.tile .n{font-family:var(--font);font-weight:300;letter-spacing:-0.02em;font-size:clamp(24px,34.8px,37px);color:var(--gold);line-height:1;}
.tile .l{font-size:clamp(16px,17.3px,19px);color:var(--muted);margin-top:6px;}
.clientes-lista{
  display:flex;flex-wrap:wrap;gap:10px;
  margin-top:clamp(16px,17.3px,24px);
}
.client-chip{
  background:var(--panel);border:1px solid var(--panel-line);
  border-radius:999px;padding:8px 18px;
  font-size:clamp(14px,16.1px,18px);font-weight:500;
  color:var(--paper);
}
.client-chip::before{content:'✓ ';color:var(--mint);}

/* ===== SLIDE: FUNIL ===== */
.funnel-subtitle{
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,17.3px,18px);
  color:var(--muted);
  margin-top:-6px;
  margin-bottom:clamp(20px,21.6px,32px);
}
.funnel-single{max-width:960px;}
.temp-tiles{display:flex;gap:16px;margin-bottom:clamp(24px,24.5px,36px);max-width:520px;}
.temp-tile{
  flex:1;border-radius:8px;padding:16px 20px;
  display:flex;flex-direction:column;gap:4px;
  border:1px solid;
}
.temp-tile.quente{background:rgba(240,97,109,0.10);border-color:rgba(240,97,109,0.3);}
.temp-tile.morno{background:rgba(245,181,68,0.10);border-color:rgba(245,181,68,0.3);}
.temp-tile .temp-label{font-family:var(--font);font-variant-numeric:tabular-nums;font-size:clamp(15px,16.4px,18px);color:var(--muted);}
.temp-tile .temp-total{font-family:var(--font);font-weight:300;letter-spacing:-0.02em;font-size:clamp(21px,28.7px,30px);}
.temp-tile.quente .temp-total{color:var(--coral);}
.temp-tile.morno .temp-total{color:var(--amber);}
.temp-tile .temp-count{font-family:var(--font);font-variant-numeric:tabular-nums;font-size:clamp(15px,16.3px,18px);color:var(--muted);}
.hot-title{font-size:clamp(16px,16.9px,19px);color:var(--muted);margin-bottom:14px;}
.deal-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.deal-card{
  background:var(--panel);border:1px solid var(--panel-line);
  border-radius:8px;padding:14px 18px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
}
.deal-card .name{font-weight:500;font-size:clamp(16px,16.1px,18px);}
.deal-card .val{font-family:var(--font);font-variant-numeric:tabular-nums;color:var(--mint);font-size:clamp(16px,16.4px,19px);margin-top:2px;}
.deal-card .stage-tag{color:var(--muted);font-size:clamp(15px,16.3px,18px);margin-top:4px;}
.temp{font-size:clamp(14px,14.3px,18px);padding:3px 9px;border-radius:999px;font-family:var(--font);font-variant-numeric:tabular-nums;flex-shrink:0;}
.temp.quente{background:rgba(240,97,109,0.15);color:var(--coral);}
.temp.morno{background:rgba(245,181,68,0.15);color:var(--amber);}
.temp.frio{background:rgba(39,170,225,0.15);color:var(--sky);}

/* ===== SLIDE: CELEBRATION ===== */
.celebrate{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  justify-content:center;height:100%;position:relative;
}
.celebrate .badge{
  font-size:clamp(40px,76.8px,72px);
  margin-bottom:10px;
}
.celebrate .headline{
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  
  font-size:clamp(30px,65.5px,77px);
  line-height:1.02;
  max-width:1100px;
}
/* Razao social longa cabe encolhendo a manchete, nao quebrando em tres linhas
   e empurrando o sino e os valores para fora da tela. O renderer escolhe a
   faixa pelo tamanho do nome, entao vale para qualquer ativacao futura. */
.celebrate .headline.medio{font-size:clamp(32px,62.7px,74px);max-width:1180px;}
.celebrate .headline.compacto{font-size:clamp(26px,47.4px,56px);max-width:1240px;line-height:1.08;}
.celebrate .headline .who{color:var(--gold);}
.celebrate .sub{
  margin-top:16px;
  font-size:clamp(15px,20.5px,22px);
  color:var(--muted);
}
.celebrate .amount{
  margin-top:clamp(20px,21.6px,30px);
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(20px,28.2px,30px);
  color:var(--mint);
  border:1px solid rgba(40,182,101,0.35);
  padding:10px 26px;border-radius:999px;
  background:rgba(40,182,101,0.08);
}
/* O sino balança sozinho, como no slide do PowerPoint. */
.celebrate .sino{
  font-size:clamp(46px,89.6px,86px);
  transform-origin:50% 12%;
  animation:sobe .7s cubic-bezier(.2,.8,.2,1) both, badalo 1.6s ease-in-out .7s 6;
}
@keyframes badalo{
  0%,100%{transform:rotate(0deg);}
  10%{transform:rotate(16deg);} 25%{transform:rotate(-13deg);}
  40%{transform:rotate(9deg);}  55%{transform:rotate(-6deg);}
  70%{transform:rotate(3deg);}  85%{transform:rotate(-1deg);}
}
/* Entradas em cascata: cada bloco sobe um pouquinho depois do anterior. */
@keyframes sobe{ from{opacity:0;transform:translateY(26px);} to{opacity:1;transform:translateY(0);} }
.celebrate .toca,
.celebrate .headline,
.celebrate .closer,
.celebrate .cel-valores{ animation:sobe .7s cubic-bezier(.2,.8,.2,1) both; }
.celebrate .toca{animation-delay:.15s;}
.celebrate .headline{animation-delay:.3s;}
.celebrate .closer{animation-delay:.5s;}
.celebrate .cel-valores{animation-delay:.7s;}

.celebrate .toca{
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(13px,16.6px,18px);
  letter-spacing:0.22em;text-transform:uppercase;
  color:var(--gold);margin-top:4px;
}
.celebrate .closer{
  display:flex;align-items:center;gap:12px;
  margin-top:clamp(16px,17.3px,26px);
  font-size:clamp(14px,17.9px,20px);color:var(--muted);
}
.celebrate .closer b{color:var(--paper);font-weight:500;}
.celebrate .closer .foto{
  width:clamp(38px,46.1px,50px);height:clamp(38px,46.1px,50px);
  border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;color:#090F20;
  font-size:clamp(15px,16.6px,19px);
}
.celebrate .closer .foto img{width:100%;height:100%;object-fit:cover;}
.fotos-ativacao{display:flex;flex-shrink:0;}
.fotos-ativacao .foto{border:2px solid var(--ink);}
.fotos-ativacao .foto:not(:first-child){margin-left:-12px;}
.cel-valores{
  display:flex;gap:clamp(12px,20.5px,20px);flex-wrap:wrap;justify-content:center;
  margin-top:clamp(20px,21.6px,30px);
}
.cel-chip{
  border-radius:16px;padding:clamp(12px,17.9px,18px) clamp(20px,30.7px,32px);
  border:1px solid;display:flex;flex-direction:column;gap:4px;min-width:220px;
}
.cel-chip .rot{
  font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,17.3px,18px);letter-spacing:0.1em;
  text-transform:uppercase;color:var(--muted);
}
.cel-chip .val{
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(22px,32.8px,37px);line-height:1;
}
.cel-chip.destaque{background:rgba(40,182,101,0.10);border-color:rgba(40,182,101,0.35);}
.cel-chip.destaque .val{color:var(--mint);animation:pulsar 1.8s ease-in-out 1.2s 3;}
.cel-chip.credito{background:rgba(95,192,233,0.08);border-color:rgba(95,192,233,0.3);}
.cel-chip.credito .val{color:var(--gold);}
@keyframes pulsar{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }

.confetti{position:absolute;top:-20px;border-radius:2px;opacity:0.9;animation:fall linear infinite;}
@keyframes fall{
  0%{transform:translateY(-40px) rotate(0deg);}
  100%{transform:translateY(828px) rotate(360deg);}
}

/* ===== SLIDE: EVENTO (Vixtra Talks) ===== */
.evento-topo{display:flex;align-items:baseline;gap:clamp(16px,30.7px,30px);flex-wrap:wrap;}
.evento-num{
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(45px,81.9px,102px);line-height:0.95;color:var(--gold);
}
.evento-topo .oque{font-size:clamp(16px,21.8px,24px);line-height:1.25;max-width:640px;}
.evento-topo .oque b{color:var(--paper);}
.evento-sub{color:var(--muted);font-size:clamp(13px,14.7px,17px);margin-top:6px;}
.evento-corpo{
  display:flex;gap:clamp(24px,51.2px,56px);align-items:center;flex-wrap:wrap;
  margin-top:clamp(20px,21.6px,32px);
}
.evento-campeao{display:flex;align-items:center;gap:clamp(16px,30.7px,28px);}
/* O .avatar-big so tinha tamanho dentro de .spotlight; fora dali a foto saia no
   tamanho original e engolia o slide inteiro. */
.evento-campeao .avatar-big{
  width:clamp(96px,140.8px,150px);height:clamp(96px,140.8px,150px);
  border-radius:16px;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, var(--sky), var(--overline));
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(27px,36.9px,42px);color:#090F20;
}
.evento-campeao .avatar-big img{width:100%;height:100%;object-fit:cover;}
.evento-campeao .rotulo{
  font-family:var(--font);font-variant-numeric:tabular-nums;font-size:clamp(15px,16.4px,18px);
  letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);
}
.evento-campeao .nome{
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(22px,34.8px,40px);line-height:1.05;
}
.evento-campeao .feito{color:var(--muted);font-size:clamp(16px,16.9px,19px);margin-top:6px;max-width:340px;line-height:1.4;}
.evento-premio{
  display:inline-block;margin-top:12px;
  background:rgba(95,192,233,0.10);border:1px solid rgba(95,192,233,0.3);
  color:var(--gold);border-radius:999px;padding:7px 16px;
  font-family:var(--font);font-variant-numeric:tabular-nums;font-size:clamp(16px,17.3px,19px);
}
.podio{display:flex;flex-direction:column;gap:10px;flex:1;min-width:300px;}
.podio-linha{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--panel-line);
  border-radius:8px;padding:10px 16px;
}
.podio-linha .medalha{font-size:clamp(20px,24.3px,26px);flex-shrink:0;}
.podio-linha .nome{flex:1;font-weight:500;font-size:clamp(16px,17.7px,19px);}
.podio-linha .quantos{
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(13px,15.4px,17px);color:var(--gold);flex-shrink:0;
}
.podio-linha .quantos span{font-family:var(--font);font-variant-numeric:tabular-nums;font-weight:400;font-size:0.62em;color:var(--muted);margin-left:5px;}

/* ===== SLIDE: BIRTHDAYS ===== */
.grid-people{
  display:flex;gap:clamp(16px,30.7px,28px);flex-wrap:wrap;margin-top:8px;
}
.person-card{
  background:var(--panel);border:1px solid var(--panel-line);
  border-radius:16px;padding:clamp(18px,25.6px,26px);
  width:clamp(170px,230.4px,220px);
  text-align:center;
}
.avatar{
  width:clamp(56px,76.8px,76px);height:clamp(56px,76.8px,76px);
  border-radius:50%;
  margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(16px,22.5px,22px);
  color:#090F20;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.person-card .name{font-weight:500;font-size:clamp(14px,14.1px,17px);}
.person-card .date{color:var(--muted);font-size:clamp(16px,16.4px,19px);margin-top:4px;font-family:var(--font);font-variant-numeric:tabular-nums;}

/* ===== SLIDE: ANIVERSÁRIOS DE CASA ===== */
.anniv-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(280px,1fr));
  gap:10px 28px;
  max-width:920px;
}
.anniv-row{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--panel-line);
  border-radius:8px;padding:12px 16px;
}
.anniv-avatar{
  width:clamp(30px,35.8px,38px);height:clamp(30px,35.8px,38px);
  border-radius:50%;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(14px,15.4px,15px);color:#090F20;
}
.anniv-avatar img{width:100%;height:100%;object-fit:cover;}
.anniv-name{font-weight:500;font-size:clamp(16px,16.9px,18px);flex:1;}
.anniv-years{
  color:var(--gold);font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,16.4px,18px);white-space:nowrap;
}
.anniv-date{
  color:var(--muted);font-family:var(--font);font-variant-numeric:tabular-nums;
  font-size:clamp(15px,16.4px,18px);white-space:nowrap;
}

/* ===== SLIDE: NEW HIRE ===== */
.spotlight{
  display:flex;align-items:center;gap:56px;
}
/* O slide de novo talento tem pouco texto: na TV ele ficava pequeno e
   encostado à esquerda, então aqui tudo é maior que no resto do painel. */
.spotlight .spotlight-nome{font-size:68px;line-height:1.05;}
.spotlight .avatar-big{
  width:280px;height:280px;
  border-radius:16px;
  background:linear-gradient(135deg, var(--sky), var(--overline));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-weight:300;letter-spacing:-0.02em;
  font-size:clamp(35px,51.2px,58px);
  color:#090F20;flex-shrink:0;
  overflow:hidden;
}
.spotlight .avatar-big img{width:100%;height:100%;object-fit:cover;}
.spotlight .role{
  font-family:var(--font);font-variant-numeric:tabular-nums;color:var(--mint);
  font-size:24px;margin-top:10px;
}
.spotlight .quote{
  margin-top:22px;font-size:26px;
  color:var(--muted);max-width:760px;font-style:italic;
}

   negativo faz o slide já abrir com balões no meio do caminho. */
.baloes{position:absolute;top:0;bottom:0;right:0;width:360px;overflow:hidden;pointer-events:none;}
.balao{position:absolute;bottom:-150px;width:70px;height:140px;animation:balao-sobe linear infinite;}
.balao:nth-child(1){left:10px; animation-duration:11s;animation-delay:-2s;}
.balao:nth-child(2){left:120px;animation-duration:13s;animation-delay:-8s;width:84px;height:168px;}
.balao:nth-child(3){left:230px;animation-duration:10s;animation-delay:-5s;}
.balao:nth-child(4){left:60px; animation-duration:12s;animation-delay:-10s;width:58px;height:116px;}
.balao:nth-child(5){left:180px;animation-duration:14s;animation-delay:-1s;width:76px;height:152px;}
.balao:nth-child(6){left:280px;animation-duration:12s;animation-delay:-7s;width:60px;height:120px;}
.balao:nth-child(7){left:20px; animation-duration:15s;animation-delay:-12s;width:80px;height:160px;}
@keyframes balao-sobe{
  0%{transform:translate(0,0) rotate(-5deg);}
  50%{transform:translate(22px,-380px) rotate(5deg);}
  100%{transform:translate(0,-760px) rotate(-5deg);}

// Navegador de TV nem sempre informa o tamanho da tela direito: há os que
// contam a barra do próprio navegador dentro de innerHeight e os que só
// acertam o tamanho depois de a página abrir, sem avisar com 'resize'. Por isso
// a conta usa a menor das medidas disponíveis e é refeita a cada 2 segundos.
function tamanhoVisivel(){
  const vv = window.visualViewport;
  const ws = [innerWidth, document.documentElement.clientWidth, vv && vv.width].filter(n => n > 0);
  const hs = [innerHeight, document.documentElement.clientHeight, vv && vv.height].filter(n => n > 0);
  return { w: Math.min(...ws), h: Math.min(...hs) };
}
function encaixarNaTela(){
  const tv = document.querySelector('.tv');
  const { w, h } = tamanhoVisivel();
  // Margem de respiro em volta, para TV que corta as bordas da imagem (overscan).
  // Dá para ajustar pela URL: ?margem=0.05 deixa 5% de cada lado.
  const margem = parseFloat(new URLSearchParams(location.search).get('margem')) || 0;
  const k = Math.min(w * (1 - 2 * margem) / 1280, h * (1 - 2 * margem) / 720);
  const x = (w - 1280 * k) / 2, y = (h - 720 * k) / 2;
  tv.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
  mostrarDiagnostico(w, h, k);
}

// Abrindo o painel com ?diag=1, aparece um quadro com as medidas que o

function mostrarDiagnostico(w, h, k){
  if(!/[?&]diag=1/.test(location.search)) return;
  let box = document.getElementById('diag');
  if(!box){
    box = document.createElement('pre');
    box.id = 'diag';
    box.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99;margin:0;padding:10px 12px;' +
      'background:rgba(0,0,0,.85);color:#8FDCFA;font:14px/1.4 monospace;border:1px solid #27AAE1;white-space:pre-wrap;max-width:90vw;';
    document.body.appendChild(box);
  }
  const vv = window.visualViewport;
  box.textContent =
    `usado: ${Math.round(w)} x ${Math.round(h)}  escala: ${k.toFixed(3)}\n` +
    `innerWidth x innerHeight: ${innerWidth} x ${innerHeight}\n` +
    `clientWidth x clientHeight: ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}\n` +
    `visualViewport: ${vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + ' (zoom ' + vv.scale + ')' : 'não tem'}\n` +
    `screen: ${screen.width} x ${screen.height}  devicePixelRatio: ${devicePixelRatio}\n` +
    `navegador: ${navigator.userAgent}`;
}

encaixarNaTela();
addEventListener('resize', encaixarNaTela);

/* ==========================================================================
   COMO FUNCIONAM AS ATUALIZAÇÕES DESTE PAINEL — LEIA ANTES DE PUBLICAR
   ==========================================================================
   Os dados de conteúdo (meta, pipeline, vendedores, aniversários etc.) estão
   hoje fixos no array DEFAULT_SLIDES logo abaixo. Isso é só o ponto de
   partida — a ideia é que, ao publicar este painel de verdade, vocês
   substituam a função loadSlidesFromSource() para buscar os dados de uma
   fonte externa em vez do array fixo. Assim, atualizar o painel vira só
   editar essa fonte de dados — sem tocar neste arquivo HTML nunca mais.

   Opções de fonte de dados, da mais simples para a mais robusta:

   1) Um arquivo data.json hospedado junto com este HTML, editado direto
      pela interface web do GitHub (ou qualquer host estático). Exemplo:

        const DATA_URL = 'data.json';
        async function loadSlidesFromSource(){
          try{
            const res = await fetch(DATA_URL + '?t=' + Date.now()); // evita cache
            if(!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if(Array.isArray(data) && data.length) return data;
          }catch(e){ console.warn('Falha ao buscar dados:', e); }
          return null;
        }

   2) Uma planilha do Google Sheets publicada como JSON (via serviços como
      Sheety, SheetDB ou um Apps Script simples) — bom se quem atualiza os
      números prefere trabalhar em planilha em vez de editar JSON direto.

   3) Um endpoint de API própria (backend do time de dados/engenharia),
      integrando direto com HubSpot/CRM/CET-SP/CR2 e automatizando tudo.

   Em qualquer um dos casos, a função loadSlidesFromSource() abaixo é o
   ÚNICO lugar que precisa mudar. O resto do painel (rotação, layout,
   cálculo de mês vigente, expiração automática de slides etc.) já funciona
   sozinho a partir do array retornado, desde que ele siga o mesmo formato
   do DEFAULT_SLIDES.
   ========================================================================== */

// ---------- REGRAS DE EXPIRAÇÃO AUTOMÁTICA ----------
// Celebração de ativação: 24h após a postagem, e some. Para deixar mais tempo,
// ponha "diasVisivel" no slide dentro do data.json (7 = uma semana).
// Novo talento: fica visível por 30 dias após a chegada, depois some.
// Dá para mudar caso a caso pondo "diasVisivel" no slide dentro do data.json.
function isSlideActive(s){
  const now = new Date();
  // Qualquer slide pode trazer "visivelAte" (data ISO) e sair de cena sozinho.
  if(s.visivelAte && now > new Date(s.visivelAte + 'T23:59:59-03:00')) return false;
  if(s.type==='celebration' && s.postedAt){
    const horasDesde = (now - new Date(s.postedAt)) / (1000*60*60);
    return horasDesde <= (s.diasVisivel || 1) * 24;
  }
  if(s.type==='newhire' && s.joinedAt){
    const daysSince = (now - new Date(s.joinedAt+'T00:00:00-03:00')) / (1000*60*60*24);
    return daysSince <= (s.diasVisivel || 30);
  }
  return true;
}

// ---------- O PAINEL SE ATUALIZA SOZINHO ----------
// A TV fica dias com a mesma aba aberta. O data.json ela rebusca de 2 em 2
// minutos, mas o index.html fica no cache do navegador — então dava para a TV
// rodar código velho em cima de dados novos. Foi exatamente o que aconteceu
// quando o rodízio passou a ser calculado aqui dentro: quem estava com a
// página em cache simplesmente parou de ver o rodízio, sem nenhum aviso.
//
// Daqui em diante o painel confere de 5 em 5 minutos se saiu versão nova do
// próprio arquivo e se recarrega sozinho quando sai.
//
// IMPORTANTE: ao mexer no index.html, troque a data/número abaixo. É ela que
// avisa às telas abertas que existe coisa nova.
const VERSAO_PAINEL = /* versao-do-painel */ '2026-10-27-01';

async function conferirVersaoDoPainel(){
  try{
    const res = await fetch('index.html?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    const texto = await res.text();
    const m = texto.match(/versao-do-painel \*\/ '([^']+)'/);
    if(m && m[1] !== VERSAO_PAINEL){
      console.info('Versão nova do painel (' + m[1] + '). Recarregando.');
      location.reload();
    }
  }catch(e){ /* sem rede agora; tenta de novo no próximo ciclo */ }
}
setInterval(conferirVersaoDoPainel, 5*60*1000);

// ---------- FONTE DE DADOS (troque aqui para conectar a uma fonte real — ver bloco de comentários acima) ----------
const DATA_URL = 'data.json';
async function loadSlidesFromSource(){
  try{
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(Array.isArray(data) && data.length) return data;
  }catch(e){ console.warn('Falha ao buscar data.json:', e); }
  return null;
}

// Aniversariante do dia: sai da lista de aniversariantes do mês, sem ninguém
// precisar mexer no data.json. Abre a rotação no próprio dia e some sozinho
// às 20h (horário de São Paulo).
const ANIVERSARIO_ATE_HORA = 20;
function agoraEmSaoPaulo(){
  const partes = new Intl.DateTimeFormat('pt-BR', {
    timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', hour:'2-digit', hourCycle:'h23'
  }).formatToParts(new Date());
  const p = Object.fromEntries(partes.map(x => [x.type, x.value]));
  return { dia: `${p.day}/${p.month}`, hora: Number(p.hour) };
}
function aniversarianteDoDia(todos){
  const mes = todos.find(s => s.type==='birthdays');
  if(!mes || !mes.people) return null;
  const { dia, hora } = agoraEmSaoPaulo();
  if(hora >= ANIVERSARIO_ATE_HORA) return null;
  const people = mes.people.filter(p => p.date===dia);
  if(!people.length) return null;
  return { type:'aniversarioDia', duration:16000, eyebrow:`Aniversariante do dia · ${dia}`, people };
}

function montarRotacao(todos){
  const doDia = aniversarianteDoDia(todos);
  const ativos = (doDia ? [doDia, ...todos] : todos).filter(isSlideActive);
  return ativos.length ? ativos : todos; // salvaguarda: nunca deixar a rotação vazia
}

let allSlides = DEFAULT_SLIDES;
let slides = montarRotacao(allSlides);

function applyNewData(newAllSlides){
  allSlides = newAllSlides;
  slides = montarRotacao(allSlides);
  if(current >= slides.length) current = 0;
}

const fmtBRL = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});

function fmtCompactM(n){
  return `R$ ${(n/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}M`;
}

function buildWalletSVG(series){
  const W=1000, H=280, padL=58, padR=58, padT=44, padB=34;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const values = series.map(p=>p.v);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const stepX = plotW/(series.length-1);
  const pts = series.map((p,i)=>({
    x: padL + i*stepX,
    y: padT + (max-p.v)/range*plotH,
    ...p
  }));
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const baseline = (padT+plotH).toFixed(1);
  const areaPath = `${linePath} L ${pts[pts.length-1].x.toFixed(1)},${baseline} L ${pts[0].x.toFixed(1)},${baseline} Z`;
  const last = pts[pts.length-1];
  const labelEvery = 5;
  const labeled = pts.filter((p,i)=> i%labelEvery===0 || i===pts.length-1);
  return `
    <svg viewBox="0 0 ${W} ${H}" class="wallet-svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="walletGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--gold)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#walletGrad)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${labeled.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p===last?6:4}" fill="${p===last?'var(--gold)':'var(--ink)'}" stroke="var(--gold)" stroke-width="2"/>`).join('')}
      ${labeled.map(p=>`<text x="${p.x.toFixed(1)}" y="${Math.max(16,p.y-14).toFixed(1)}" font-size="19" font-weight="500" fill="var(--paper)" text-anchor="middle" font-family="'Rubik', sans-serif">${fmtCompactM(p.v)}</text>`).join('')}
      ${labeled.map(p=>`<text x="${p.x.toFixed(1)}" y="${H-8}" font-size="19" fill="var(--muted)" text-anchor="middle" font-family="'Rubik', sans-serif">${p.t}</text>`).join('')}
    </svg>`;
}

function eyebrowText(s){
  return s.showMonth ? `${s.eyebrow} · ${mesAtual()}` : s.eyebrow;
}

function renderSlide(s){
  if(s.type==='goal'){
    // Meta do mes ainda nao definida: mostrar o que ja foi ativado sem
    // inventar um percentual (0/0 virava "NaN%" na tela).
    if(!s.metaValor){

      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="goal-num" style="font-size:43.5px">Meta do mês a definir</div>

      </div>
      <div class="clientes-lista">
        ${s.clientesLista.map(c=>`<span class="client-chip">${c}</span>`).join('')}

  }
  if(s.type==='funnel'){
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="funnel-subtitle">${s.subtitle}</div>
      <div class="funnel-single">

        <div class="hot-title">Top 3 negócios em destaque</div>

          ${s.top3.map(d=>`
            <div class="deal-card">
              <div><div class="name">${d.name}</div><div class="val">${fmtBRL(d.value)}</div>${d.owner ? `<div class="stage-tag">${d.owner}</div>` : ''}</div>
              <span class="temp ${d.temp}">${d.temp}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }
  if(s.type==='wallet'){
    const isUp = s.pctChange>=0;
    // A meta de carteira e os chips abaixo: o "faltam" NAO fica gravado no
    // data.json, e recalculado a cada render a partir do valor atual. Assim
    // basta atualizar a carteira que o numero acompanha sozinho.
    const meta = s.metaCarteira;
    const falta = meta != null ? meta - s.current : null;
    const metas = meta == null ? '' : `
      <div class="wallet-metas">
        <div class="wallet-chip alvo">
          <span class="rot">${s.metaCarteiraRotulo || 'Meta da carteira'}</span>
          <span class="val">${milhoesCurto(meta)}</span>
        </div>
        <div class="wallet-chip ${falta > 0 ? 'falta' : 'batida'}">
          <span class="rot">${falta > 0 ? 'Faltam' : 'Meta batida'}</span>
          <span class="val">${falta > 0 ? milhoesCurto(falta) : '+' + milhoesCurto(-falta)}</span>
        </div>
      </div>`;
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="wallet-top">
        <div class="wallet-value">${fmtBRL(Math.round(s.current))}</div>

        <div class="cel-valores">
          <div class="cel-chip destaque"><span class="rot">Valor da ativação</span><span class="val">${ativado}</span></div>
          ${credito ? `<div class="cel-chip credito"><span class="rot">Limite aprovado</span><span class="val">${credito}</span></div>` : ''}
        </div>
      </div>`;
  }
  if(s.type==='evento'){
    const medalhas = ['🥇','🥈','🥉'];
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="evento-topo">
        <div class="evento-num">${s.numero}</div>
        <div>
          <div class="oque">${s.titulo}</div>
          ${s.subtitulo ? `<div class="evento-sub">${s.subtitulo}</div>` : ''}
        </div>
      </div>
      <div class="evento-corpo">
        ${s.campeao ? `
          <div class="evento-campeao">
            <div class="avatar-big" style="${s.campeao.photo ? 'background:transparent' : ''}">${avatarInner(s.campeao)}</div>
            <div>
              <div class="rotulo">${s.campeao.rotulo || 'Campeão'}</div>
              <div class="nome">${s.campeao.name}</div>
              <div class="feito">${s.campeao.feito}</div>
              ${s.campeao.premio ? `<div class="evento-premio">${s.campeao.premio}</div>` : ''}
            </div>
          </div>` : ''}
        <div class="podio">
          ${(s.podio || []).map((p,i)=>`
            <div class="podio-linha">
              <span class="medalha">${medalhas[i] || ''}</span>
              <div class="mini-avatar" style="background:${avatarBg(p)}">${avatarInner(p)}</div>
              <span class="nome">${p.name}</span>
              <span class="quantos">${p.quantos}<span>${p.quantos === 1 ? 'convidado' : 'convidados'}</span></span>
            </div>`).join('')}
        </div>
      </div>`;
  }
  if(s.type==='birthdays'){
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="grid-people">
        ${s.people.map(p=>`
          <div class="person-card">
            <div class="avatar" style="background:${avatarBg(p)}">${avatarInner(p)}</div>
            <div class="name">${p.name}</div>
            <div class="date">${p.date}</div>
          </div>`).join('')}
      </div>`;
  }
  if(s.type==='aniversarioDia'){
    const nomes = s.people.map(p => p.name.split(' ')[0]);
    const chamada = nomes.length > 1 ? `${nomes.slice(0,-1).join(', ')} e ${nomes[nomes.length-1]}` : nomes[0];
    const balao = (cor) => `
      <svg class="balao" viewBox="0 0 60 120">
        <path d="M30 75 C24 90, 36 102, 30 120" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
        <path d="M30 66 L25 76 L35 76 Z" fill="${cor}"/>
        <ellipse cx="30" cy="36" rx="25" ry="31" fill="${cor}"/>
        <ellipse cx="21" cy="24" rx="6" ry="11" fill="rgba(255,255,255,0.35)" transform="rotate(-22 21 24)"/>
      </svg>`;
    const cores = ['#5FC0E9','#F5B544','#F0616D','#28B665','#9B8CFF','#27AAE1','#F5B544'];
    return `
      ${makeConfetti()}
      <div class="baloes" aria-hidden="true">${cores.map(balao).join('')}</div>
      <div class="niver">
        <div class="niver-fotos ${s.people.length > 1 ? 'varias' : ''}">
          ${s.people.slice(0,3).map(p=>`<div class="niver-avatar" style="background:${p.photo ? 'transparent' : (p.color || 'var(--amber)')}">${avatarInner(p)}</div>`).join('')}
        </div>
        <div>
          <div class="eyebrow">${eyebrowText(s)}</div>
          <div class="niver-titulo">Feliz aniversário, <em>${chamada}!</em></div>
          <div class="niver-nome">${s.people.map(p=>p.name).join(' · ')}</div>
          <div class="niver-texto">Parabéns, ${chamada}!</div>
        </div>
      </div>`;
  }
  if(s.type==='companyAnniv'){
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="anniv-grid">
        ${s.people.map(p=>`
          <div class="anniv-row">
            <div class="anniv-avatar" style="background:${avatarBg(p)}">${avatarInner(p)}</div>
            <span class="anniv-name">${p.name}</span>
            <span class="anniv-years">${p.years} ano${p.years>1?'s':''} de casa</span>
            <span class="anniv-date">${p.date}</span>
          </div>`).join('')}
      </div>`;
  }
  if(s.type==='newhire'){
    // "fatos" e uma lista de {rotulo, texto} — Curiosidade, Hobby, o que vier.
    // Sem ela, cai no "quote" de antes. E a data de chegada so aparece se existir.
    const corpo = (s.fatos && s.fatos.length)
      ? s.fatos.map(f=>`<div class="fato"><b>${f.rotulo}</b> ${f.texto}</div>`).join('')
      : (s.quote ? `<div class="quote">${s.quote}</div>` : '');
    const cargo = [s.role, s.joined].filter(Boolean).join(' · ');
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="spotlight">
        <div class="avatar-big" style="${s.photo ? 'background:transparent' : ''}">${avatarInner(s)}</div>
        <div>
          <div class="goal-num spotlight-nome">${s.name}</div>
          <div class="role">${cargo}</div>
          ${corpo}
        </div>
      </div>`;
  }
  if(s.type==='campanha'){
    // Slide de ação interna (Halloween, festa, campanha). "titulo" e "texto"
    // aceitam <em> (cor do tema) e <b>. "arte" é uma lista de emojis: o
    // primeiro fica grande, os outros flutuam em volta. Cada item pode ser um
    // emoji ou o caminho de uma imagem (.svg/.png): emoji muda de desenho de
    // aparelho para aparelho (Apple no Mac, Google na Mi Box), imagem não.
    const arte = s.arte || [];
    const desenho = (e) => /\.(svg|png)$/i.test(e) ? `<img src="${e}" alt="">` : e;
    return `
      <div class="campanha ${s.tema || ''}">
        <div class="campanha-texto">
          <div class="eyebrow">${eyebrowText(s)}</div>
          <div class="campanha-titulo">${s.titulo}</div>
          ${s.texto ? `<div class="campanha-desc">${s.texto}</div>` : ''}
          ${s.premio ? `<div class="campanha-premio"><span class="rot">${s.premioRotulo || 'Prêmio'}</span><span class="val">${s.premio}</span></div>` : ''}
          ${s.chamada ? `<div class="campanha-chamada">${s.chamada}</div>` : ''}
          ${s.pergunta ? `<div class="campanha-pergunta">${s.pergunta}</div>` : ''}
        </div>
        ${arte.length ? `<div class="campanha-arte"><span class="principal">${desenho(arte[0])}</span>${arte.slice(1, 5).map((e,i)=>`<span class="e${i+1}">${desenho(e)}</span>`).join('')}</div>` : ''}
      </div>`;
  }
  if(s.type==='news'){
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="news-row">
        ${s.items.map(n=>`
          <div class="news-card">
            <span class="news-tag ${n.tag}">${n.tag}</span>
            <h3>${n.title}</h3>
            ${n.linhas
              ? `<div class="news-lista">${n.linhas.map(l=>`<div class="linha"><span class="quando">${l.quando}</span><span class="oque">${l.oque}</span></div>`).join('')}</div>`
              : `<p>${n.text}</p>`}
          </div>`).join('')}
      </div>`;
  }
  if(s.type==='ranking'){
    const score = (v) => v.value != null ? v.value : (v.oportunidades != null ? v.oportunidades : 0);
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="division-grid">
        ${s.divisions.map(div=>{
          const sorted = [...div.sellers].sort((a,b)=> score(b)-score(a));
          return `
          <div class="division-card">
            <div class="division-title">${div.name}</div>
            ${sorted.length ? sorted.map((v,i)=>`
              <div class="mini-row">
                <div class="mini-pos">${i+1}</div>
                ${v.people ? `
                  <div class="mini-avatar-group">
                    ${v.people.map(p=>`<div class="mini-avatar stacked" style="background:${avatarBg(p)}">${avatarInner(p)}</div>`).join('')}
                  </div>
                  <div class="mini-info">
                    <div class="name">${v.people.map(p=>p.name).join(' & ')}</div>
                  </div>
                ` : `
                  <div class="mini-avatar" style="background:${avatarBg(v)}">${avatarInner(v)}</div>
                  <div class="mini-info">
                    <div class="name">${v.name}</div>
                    ${v.deals ? `<div class="meta">${v.deals} negócio${v.deals>1?'s':''}</div>` : ''}
                  </div>
                `}
                <div class="mini-value">${v.value ? fmtBRL(v.value) : (v.oportunidades!=null ? `${v.oportunidades.toLocaleString('pt-BR')} ${rotuloMetrica(v.oportunidades, v.metricLabel)}` : '')}</div>
              </div>`).join('') : (div.metrics ? '' : `<div class="division-empty">Em apuração</div>`)}
            ${div.metrics ? `<div class="div-metrics">${div.metrics.map(m=>`<div class="div-metric"><span class="v">${m.value}</span><span class="l">${m.label}</span></div>`).join('')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
  }
  if(s.type==='currency'){
    return `
      <div class="eyebrow">${eyebrowText(s)}</div>
      <div class="curr-row">
        ${s.list.map(c=>{
          const isUp = c.pct>=0;
          const valStr = c.value.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
          return `
            <div class="curr-card">
              <div class="pair"><span class="flag">${c.flag}</span>${c.code} / BRL</div>
              <div class="val">R$ ${valStr}</div>
              <div class="var ${isUp?'up':'down'}">${isUp?'▲':'▼'} ${Math.abs(c.pct).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}% hoje</div>
            </div>`;
        }).join('')}
      </div>
      ${s.offline ? `<div class="curr-updated">Não foi possível atualizar as cotações agora</div>` : ''}`;
  }
  return '';
}

// Deixa o rótulo no singular quando a contagem é 1: '1 oportunidade',
// '1 embarque confirmado', '1 solicitação'. Palavra a palavra, porque alguns
// rótulos têm mais de uma ('embarques confirmados').
function singular(rotulo){
  return String(rotulo).split(' ').map(p=>{
    if(/ões$/.test(p)) return p.replace(/ões$/,'ão');
    if(/ães$/.test(p)) return p.replace(/ães$/,'ão');
    if(/[rzns]es$/.test(p)) return p.replace(/es$/,'');
    if(/s$/.test(p)) return p.replace(/s$/,'');
    return p;
  }).join(' ');
}
function rotuloMetrica(n, rotulo){
  const base = rotulo || 'oportunidades';
  return n === 1 ? singular(base) : base;
}

function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

// Retorna o conteúdo do avatar: foto real (Slack) se disponível, senão iniciais
// "R$ 324M", "R$ 69,5M": compacto para caber ao lado do valor da carteira.
// Sem casa decimal quando o numero e redondo, uma casa quando nao e.
function milhoesCurto(v){
  const m = v / 1e6;
  const casas = Math.abs(m - Math.round(m)) < 0.05 ? 0 : 1;
  return 'R$ ' + m.toLocaleString('pt-BR', {minimumFractionDigits:casas, maximumFractionDigits:casas}) + 'M';
}

function avatarInner(p){
  // A imagem nao pode ser preguicosa: o slide so entra no DOM quando chega a
  // vez dele, e o navegador concluia que a foto ainda nao era necessaria — ela
  // ficava em branco para sempre. Sao poucas imagens; carregar e barato.
  return p.photo ? `<img src="${p.photo}" alt="${p.name}" decoding="async">` : initials(p.name);
}
// Retorna a cor de fundo do avatar: só é usada quando não há foto (fica atrás das iniciais)
function avatarBg(p){
  return p.photo ? 'transparent' : (p.color || 'var(--panel-line)');
}

function makeConfetti(){
  const colors=['var(--gold)','var(--mint)','var(--coral)','var(--sky)'];
  let html='';
  for(let i=0;i<24;i++){
    const left = Math.random()*100;
    const size = 6+Math.random()*8;
    const dur = 3+Math.random()*3;
    const delay = Math.random()*3;
    const color = colors[i%colors.length];
    html += `<div class="confetti" style="left:${left}%;width:${size}px;height:${size*1.6}px;background:${color};animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
  }
  return html;
}

// ---------- ROTAÇÃO ----------
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
const progFill = document.getElementById('progFill');
let current = 0;
let timer = null;

slides.forEach((_,i)=>{
  const b = document.createElement('button');
  b.className='dot-btn'+(i===0?' on':'');
  b.addEventListener('click',()=>goTo(i));
  dotsWrap.appendChild(b);
});

function rebuildDots(){
  dotsWrap.innerHTML='';
  slides.forEach((_,i)=>{
    const b = document.createElement('button');
    b.className='dot-btn'+(i===current?' on':'');
    b.addEventListener('click',()=>goTo(i));
    dotsWrap.appendChild(b);
  });
}

function paintDots(){
  [...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on', i===current));
}

function renderCurrent(){
  stage.innerHTML = `<div class="slide active">${renderSlide(slides[current])}</div>`;
  paintDots();
  buildTicker();
  restartProgress(slides[current].duration);
}

function goTo(i){
  current = i;
  renderCurrent();
  clearTimeout(timer);
  scheduleNext();
}

function scheduleNext(){
  timer = setTimeout(()=>{
    current = (current+1)%slides.length;
    renderCurrent();
    scheduleNext();
  }, slides[current].duration);
}

function restartProgress(duration){
  progFill.classList.remove('animate');
  progFill.style.width='0%';
  void progFill.offsetWidth; // reflow
  progFill.style.animationDuration = duration+'ms';
  progFill.classList.add('animate');
}

// ---------- TICKER (elemento de assinatura, sempre visível) ----------
let tickerAtual = '';
function buildTicker(){
  const goal = slides.find(s=>s.type==='goal');
  const cel = slides.find(s=>s.type==='celebration'); // undefined se já passou de 24h
  const bday = slides.find(s=>s.type==='birthdays');
  const curr = slides.find(s=>s.type==='currency');
  const novatos = slides.filter(s=>s.type==='newhire'); // vazio se já passou da janela de exibição
  const wallet = slides.find(s=>s.type==='wallet');
  const usd = curr ? curr.list.find(c=>c.code==='USD') : null;
  const falta = goal.metaValor - goal.atual;
  const bits = [
    `🎯 Faltam <b>${fmtBRL(falta)}</b> para bater a meta do mês`,
    `🔥 <b>${fmtBRL(slides.find(s=>s.type==='funnel').quenteTotal)}</b> em negócios quentes no pipeline de closing`,
    ...(cel ? [`🎉 <b>${cel.who}</b> ativou <b>${cel.client}</b> — ${cel.valorAtivado != null ? fmtBRL(cel.valorAtivado) : cel.amount}`] : []),
    `🎂 <b>${bday.people.length}</b> aniversários este mês`,
    ...(novatos.length ? [`👋 Boas-vindas, ${novatos.map(n=>`<b>${n.name}</b>`).join(' e ')}!`] : []),
    ...(usd ? [`💵 Dólar a <b>R$ ${usd.value.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</b>`] : []),
    ...(wallet ? [`📈 Carteira em <b>${fmtBRL(Math.round(wallet.current))}</b>`] : []),
  ];
  const html = bits.map(b=>`<span>${b}</span>`).join('');
  // Esta função roda a cada troca de slide; reescrever o letreiro com o mesmo
  // texto só serviria para reiniciar a rolagem no meio da frase.
  if(html === tickerAtual) return;
  tickerAtual = html;
  document.getElementById('tickerMove').innerHTML = html;
  reiniciarTicker();
}

// O Safari calcula o translateX(100%) da animação com a largura que o letreiro
// tinha quando ela começou, e não recalcula depois. Na abertura da página o
// letreiro ainda está vazio (o texto só entra depois que o data.json chega),
// então ia de 0 a 0 e ficava parado. Chrome e Firefox medem de novo a cada
// quadro, por isso lá sempre funcionou. Reiniciar a animação toda vez que o
// texto ou a fonte mudam obriga o Safari a medir de novo.
function reiniciarTicker(){
  const track = document.getElementById('tickerMove');
  track.style.animation = 'none';
  void track.offsetWidth; // reflow
  track.style.animation = '';
}
if(document.fonts) document.fonts.ready.then(reiniciarTicker);

// ---------- RELÓGIO ----------
function tickClock(){
  const now = new Date();
  document.getElementById('clockTime').textContent =
    now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
  document.getElementById('clockDate').textContent =
    now.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', timeZone:'America/Sao_Paulo'});
}
tickClock();
setInterval(tickClock,1000);

// ---------- COTAÇÃO AO VIVO (API pública, sem chave — AwesomeAPI) ----------
async function refreshCurrency(){
  const slide = slides.find(s=>s.type==='currency');
  if(!slide) return;
  let anySuccess = false;
  try{
    // Libra, USDC e Bitcoin saíram do painel em 23/10. O USDC vinha de uma
    // segunda fonte (CoinGecko), que deixou de ser consultada.
    const res = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,USDT-BRL');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    // Mapeamento confirmado testando a API: USDT-BRL retorna sob a chave "USDBRLT", não "USDTBRL"
    const map = {USD:'USDBRL', EUR:'EURBRL', USDT:'USDBRLT'};
    slide.list.forEach(c=>{
      const d = data[map[c.code]];
      if(d){
        c.value = parseFloat(d.bid);
        c.pct = parseFloat(d.pctChange);
        anySuccess = true;
      }
    });
  }catch(err){
    console.warn('Falha ao buscar cotações (AwesomeAPI):', err);
  }
  // Sem horário no slide: o que importa para quem olha é saber se o número
  // vale ou não. Se a fonte não respondeu, o painel avisa.
  slide.offline = !anySuccess;
  if(slides[current].type==='currency') renderCurrent();
}

// ---------- CLIMA AO VIVO (API pública, sem chave — Open-Meteo) ----------
function mapWeatherCode(code){
  const table = {
    0:['Céu limpo','☀️'], 1:['Poucas nuvens','🌤️'], 2:['Parcialmente nublado','⛅'], 3:['Nublado','☁️'],
    45:['Neblina','🌫️'], 48:['Neblina com geada','🌫️'],
    51:['Garoa fraca','🌦️'], 53:['Garoa','🌦️'], 55:['Garoa forte','🌦️'],
    61:['Chuva fraca','🌧️'], 63:['Chuva','🌧️'], 65:['Chuva forte','🌧️'],
    71:['Neve fraca','🌨️'], 73:['Neve','🌨️'], 75:['Neve forte','🌨️'],
    80:['Pancadas de chuva','🌧️'], 81:['Pancadas de chuva','🌧️'], 82:['Pancadas fortes','⛈️'],
    95:['Tempestade','⛈️'], 96:['Tempestade com granizo','⛈️'], 99:['Tempestade com granizo','⛈️'],
  };
  return table[code] || ['—','⛅'];
}

// Temperatura de São Paulo ao lado do relógio. Antes ia para o slide de clima e
// trânsito, que saiu do painel em 23/10.
const CLIMA_LAT = -23.5505, CLIMA_LON = -46.6333;
async function refreshWeather(){
  const alvo = document.getElementById('clockWeather');
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CLIMA_LAT}&longitude=${CLIMA_LON}&current_weather=true`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const cw = (await res.json()).current_weather;
    const [cond, icon] = mapWeatherCode(cw.weathercode);
    alvo.textContent = `${icon} ${Math.round(cw.temperature)}°C`;
    alvo.title = cond;
  }catch(err){
    // Sem resposta, a temperatura some em vez de ficar a última conhecida:
    // numa TV, número velho passa por atual.
    console.warn('Falha ao buscar o clima (Open-Meteo):', err);
    alvo.textContent = '';
  }
}

// ---------- START ----------
(async function init(){
  const fromSource = await loadSlidesFromSource();
  if(fromSource) applyNewData(fromSource);
  rebuildDots();
  renderCurrent();
  scheduleNext();
  refreshCurrency();
  refreshWeather();
})();

setInterval(refreshCurrency, 5*60*1000);  // moedas a cada 5 minutos
setInterval(refreshWeather, 15*60*1000);  // clima a cada 15 minutos

// Verifica periodicamente se a fonte de dados externa tem conteúdo novo
// (só terá efeito de verdade depois que loadSlidesFromSource() for conectada
// a uma fonte real — ver bloco de comentários no topo do arquivo)
setInterval(async ()=>{
  const fresh = await loadSlidesFromSource();
  if(fresh && JSON.stringify(fresh) !== JSON.stringify(allSlides)){
    applyNewData(fresh);
    rebuildDots();
    return;
  }
  // Mesmo sem dado novo a rotação muda com o relógio: é assim que o
  // aniversariante do dia sai às 20h e um slide com "visivelAte" sai no fim do dia.
  const agora = montarRotacao(allSlides);
  if(JSON.stringify(agora) !== JSON.stringify(slides)){
    slides = agora;
    if(current >= slides.length) current = 0;
    rebuildDots();
  }
}, 2*60*1000);
</script>
