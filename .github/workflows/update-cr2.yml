name: Atualizar evolução da carteira (CR2) — desligada

# ATENÇÃO: esta rotina está DESLIGADA de propósito.
#
# O gráfico da carteira vem do CR2, que exige login. Enquanto não existirem
# os segredos CR2_EMAIL e CR2_PASSWORD no repositório, ela falharia a cada
# execução e encheria a aba Actions de e-mails de erro. Por isso não há
# "schedule" aqui: ela só roda se alguém clicar em "Run workflow".
#
# Para ligar de vez:
#   1. Settings → Secrets and variables → Actions → New repository secret
#      CR2_EMAIL e CR2_PASSWORD
#   2. Descomentar o bloco "schedule" abaixo.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 11 * * *'   # todo dia às 11h UTC (~08h em São Paulo)

permissions:
  contents: write

concurrency:
  group: atualiza-painel
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir se as credenciais do CR2 existem
        env:
          CR2_EMAIL: ${{ secrets.CR2_EMAIL }}
        run: |
          if [ -z "$CR2_EMAIL" ]; then
            echo "Faltam os segredos CR2_EMAIL e CR2_PASSWORD. Cadastre-os em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Buscar dados do CR2
        env:
          CR2_EMAIL: ${{ secrets.CR2_EMAIL }}
          CR2_PASSWORD: ${{ secrets.CR2_PASSWORD }}
        run: node scripts/fetch-cr2.js > /tmp/cr2.json

      - name: Atualizar data.json
        run: node scripts/merge-and-save.js "" "" /tmp/cr2.json data.json

      - name: Commitar mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet && echo "Nada mudou." && exit 0
          git commit -m "Atualiza evolução da carteira (automático)"
          git pull --rebase --autostash
          git push
